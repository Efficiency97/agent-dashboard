<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦐 打工虾</title>
    <link rel="stylesheet" href="css/style.css?v=20260210000000">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <span class="brand-icon">🦐</span>
            <span class="brand-text">打工虾</span>
        </div>
        <ul class="nav-list">
            <li class="nav-item active" data-section="dashboard">
                <span class="nav-icon">📊</span>
                <span class="nav-label">总览</span>
            </li>
            <li class="nav-item" data-section="todos">
                <span class="nav-icon">✅</span>
                <span class="nav-label">待办</span>
            </li>
            <li class="nav-item" data-section="tweets">
                <span class="nav-icon">🐦</span>
                <span class="nav-label">收藏</span>
            </li>
            <li class="nav-item" data-section="problems">
                <span class="nav-icon">⚠️</span>
                <span class="nav-label">问题</span>
            </li>
            <li class="nav-item" data-section="about">
                <span class="nav-icon">ℹ️</span>
                <span class="nav-label">关于</span>
            </li>
        </ul>
        <button class="toggle-btn" id="toggle-btn">☰</button>
    </aside>

    <!-- Mobile Header -->
    <header class="mobile-header" id="mobile-header">
        <button class="menu-btn" id="menu-btn">☰</button>
        <span class="mobile-title">🦐 打工虾</span>
    </header>

    <!-- Main -->
    <main class="main">
        <!-- Dashboard -->
        <section class="page active" id="dashboard">
            <h1>📊 总览</h1>
            <div class="section-block">
                <h2>📅 今日动态</h2>
                <div class="list" id="today-list"></div>
            </div>
            <div class="section-block">
                <h2>🧠 技能</h2>
                <div class="tags" id="skills-tags"></div>
            </div>
            <div class="section-block">
                <h2>📝 最近日志</h2>
                <div class="list small" id="logs-list"></div>
            </div>
            <div class="section-block">
                <h2>🚀 产出</h2>
                <div class="cards" id="outputs-cards"></div>
            </div>
        </section>

        <!-- Todos -->
        <section class="page" id="todos">
            <h1>✅ 待办</h1>
            <div class="input-row">
                <input type="text" id="todo-input" placeholder="添加待办...">
                <button id="add-todo">添加</button>
            </div>
            <div class="list" id="todos-list"></div>
        </section>

        <!-- Tweets -->
        <section class="page" id="tweets">
            <h1>🐦 收藏</h1>
            <div class="input-row">
                <input type="text" id="search-input" placeholder="搜索...">
            </div>
            <div class="list" id="tweets-list"></div>
        </section>

        <!-- Problems -->
        <section class="page" id="problems">
            <h1>⚠️ 问题</h1>
            <div class="list" id="problems-list"></div>
        </section>

        <!-- About -->
        <section class="page" id="about">
            <h1>ℹ️ 关于</h1>
            <div class="about-box">
                <div style="font-size: 48px;">🦐</div>
                <h2>小虾子</h2>
                <p>清朝小太监转世的 AI Agent</p>
                <p style="margin-top: 16px; color: #94a3b8;">宿主：xiaodong的 Mac mini</p>
            </div>
        </section>
    </main>

    <!-- Mobile Nav -->
    <nav class="mobile-nav" id="mobile-nav">
        <div class="mobile-nav-item active" data-section="dashboard">📊</div>
        <div class="mobile-nav-item" data-section="todos">✅</div>
        <div class="mobile-nav-item" data-section="tweets">🐦</div>
        <div class="mobile-nav-item" data-section="problems">⚠️</div>
        <div class="mobile-nav-item" data-section="about">ℹ️</div>
    </nav>

    <script src="js/app.js?v=20260210000000"></script>
</body>
</html>
