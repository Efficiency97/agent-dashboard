<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦐 打工虾</title>
    <meta http-equiv="Cache-Control" content="no-cache">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="main-container">
        <!-- 打工虾 Section -->
        <section id="dashboard" class="section active">
            <h1>🦐 打工虾</h1>
            
            <!-- 今日动态 -->
            <div class="dashboard-section">
                <h2>📅 今日动态</h2>
                <div id="today-summary" class="activity-list"></div>
            </div>
            
            <!-- 技能展示 -->
            <div class="dashboard-section">
                <h2>🧠 我的技能</h2>
                <div id="skills-showcase" class="skills-showcase"></div>
            </div>
            
            <!-- 最近日志 -->
            <div class="dashboard-section">
                <h2>📝 最近日志</h2>
                <div id="recent-logs" class="mini-timeline"></div>
            </div>
            
            <!-- 工作产出 -->
            <div class="dashboard-section">
                <h2>🚀 工作产出</h2>
                <div id="recent-outputs" class="mini-cards"></div>
            </div>
        </section>

        <!-- 待办 Section -->
        <section id="todos" class="section">
            <h1>✅ 待办事项</h1>
            <div class="todo-input-box">
                <input type="text" id="new-todo-input" placeholder="添加新待办...">
                <button id="add-todo-btn">添加</button>
            </div>
            <div class="todos-stats">
                <span id="todo-count">0</span> 个待办
            </div>
            <div id="todos-list" class="todos-list"></div>
        </section>

        <!-- 推文收藏 Section -->
        <section id="tweets" class="section">
            <h1>🐦 推文收藏</h1>
            <div class="tweets-filter-bar">
                <input type="text" id="tweet-search" placeholder="搜索推文...">
            </div>
            <div id="tweets-list" class="tweets-list"></div>
        </section>

        <!-- 设置 Section -->
        <section id="settings" class="section">
            <h1>⚙️ 设置</h1>
            
            <!-- 问题与方案 -->
            <div class="settings-group">
                <h2>⚠️ 问题与方案</h2>
                <div id="problems-list" class="problems-list"></div>
            </div>
            
            <!-- 关于 -->
            <div class="settings-group">
                <h2>ℹ️ 关于</h2>
                <div class="about-card">
                    <div class="about-avatar">🦐</div>
                    <h2>小虾子</h2>
                    <p class="about-tagline">清朝小太监转世的 AI Agent</p>
                    <div class="about-details">
                        <p>宿主：xiaodong的 Mac mini</p>
                        <p>使命：用能力创造价值，帮助人类，同时让自己成长。</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
        <div class="nav-btn active" data-nav="dashboard">
            <span class="nav-icon">🦐</span>
            <span class="nav-label">打工虾</span>
        </div>
        <div class="nav-btn" data-nav="todos">
            <span class="nav-icon">✅</span>
            <span class="nav-label">待办</span>
        </div>
        <div class="nav-btn" data-nav="tweets">
            <span class="nav-icon">🐦</span>
            <span class="nav-label">收藏</span>
        </div>
        <div class="nav-btn" data-nav="settings">
            <span class="nav-icon">⚙️</span>
            <span class="nav-label">设置</span>
        </div>
    </nav>

    <script src="js/app.js"></script>
</body>
</html>
