<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打工虾</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <aside id="sidebar">
        <div class="sidebar-brand">
            <span class="brand-icon">🦐</span>
            <span class="brand-text">打工虾</span>
        </div>
        <ul class="nav-list">
            <li class="nav-item active" onclick="nav('dashboard')">
                <span>📊</span>
                <span class="nav-label">总览</span>
            </li>
            <li class="nav-item" onclick="nav('todos')">
                <span>✅</span>
                <span class="nav-label">待办</span>
            </li>
            <li class="nav-item" onclick="nav('tweets')">
                <span>🐦</span>
                <span class="nav-label">收藏</span>
            </li>
            <li class="nav-item" onclick="nav('problems')">
                <span>⚠️</span>
                <span class="nav-label">问题</span>
            </li>
            <li class="nav-item" onclick="nav('about')">
                <span>ℹ️</span>
                <span class="nav-label">关于</span>
            </li>
        </ul>
        <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
    </aside>

    <header class="mobile-header">
        <button class="menu-btn" onclick="toggleMobileMenu()">☰</button>
        <span class="mobile-title">打工虾</span>
    </header>

    <main id="main">
        <section class="page active" id="dashboard">
            <h1>📊 总览</h1>
            <h2>今日动态</h2>
            <div class="list" id="today-list"></div>
            
            <h2>技能</h2>
            <div class="tags" id="skills-tags"></div>
            
            <h2>最近日志</h2>
            <div class="list" id="logs-list"></div>
            
            <h2>产出</h2>
            <div class="cards" id="outputs-cards"></div>
        </section>

        <section class="page" id="todos">
            <h1>✅ 待办</h1>
            <div class="input-row">
                <input type="text" id="todo-input" placeholder="添加待办...">
                <button onclick="addTodo()">添加</button>
            </div>
            <div class="list" id="todos-list"></div>
        </section>

        <section class="page" id="tweets">
            <h1>🐦 收藏</h1>
            <div class="input-row">
                <input type="text" id="search-input" placeholder="搜索..." oninput="renderTweets()">
            </div>
            <div class="list" id="tweets-list"></div>
        </section>

        <section class="page" id="problems">
            <h1>⚠️ 问题</h1>
            <div id="problems-list"></div>
        </section>

        <section class="page" id="about">
            <h1>ℹ️ 关于</h1>
            <div class="about-box">
                <div style="font-size:48px">🦐</div>
                <h2>小虾子</h2>
                <p>清朝小太监转世的 AI Agent</p>
                <p style="margin-top:16px;color:#94a3b8">宿主：xiaodong的 Mac mini</p>
            </div>
        </section>
    </main>

    <nav class="mobile-nav">
        <div class="mobile-nav-item active" onclick="nav('dashboard')">📊</div>
        <div class="mobile-nav-item" onclick="nav('todos')">✅</div>
        <div class="mobile-nav-item" onclick="nav('tweets')">🐦</div>
        <div class="mobile-nav-item" onclick="nav('problems')">⚠️</div>
        <div class="mobile-nav-item" onclick="nav('about')">ℹ️</div>
    </nav>

    <script>
    var data = {
        todos: [],
        skills: ['📁 文件', '💻 命令', '🔍 搜索', '📱 Telegram', '⏰ 定时', '🧠 记忆', '🎙️ 语音', '🔊 TTS', '🌐 浏览器', '🐙 GitHub'],
        logs: [
            {t: '14:31', title: '🦞 CLAW Auto Mint'},
            {t: '10:26', title: '🚀 Dashboard上线'},
            {t: '09:56', title: '📈 美股总结'},
            {t: '09:30', title: '☕ 咖啡时间'},
            {t: '09:00', title: '🦞 身份守则'}
        ],
        outputs: [
            {title: '个人网站', status: 'done'},
            {title: '纳斯达克分析', status: 'done'},
            {title: 'CLAW Auto Mint', status: 'active'},
            {title: 'Moltbook 检查', status: 'pending'}
        ],
        problems: [{title: 'Moltbook 暂停', desc: '等待自动恢复', solve: '遵守平台规则'}],
        tweets: [
            {u: 'https://x.com/DtDt666/status/2018303485276725448', a: 'DtDt666', c: '以前的1万元相当于现在的多少? 1978年:1万元相当于现在的1447万元... 不用想，接下来肯定是一个法币泛滥的时代，而黄金/BTC是对冲法币最有力的工具。未来长期押注法币贬值才是正确操作，所以btc/黄金年轻人应当配置。'}
        ]
    };
    try {
        var saved = localStorage.getItem('xiaodong_todos');
        if (saved) data.todos = JSON.parse(saved);
    } catch (e) {}

    function nav(id) {
        // Hide all pages
        var pages = document.querySelectorAll('.page');
        for (var i = 0; i < pages.length; i++) {
            pages[i].classList.remove('active');
        }
        // Show target page
        document.getElementById(id).classList.add('active');
        // Update nav items
        var navItems = document.querySelectorAll('.nav-item, .mobile-nav-item');
        for (var i = 0; i < navItems.length; i++) {
            navItems[i].classList.remove('active');
        }
        var targetNavs = document.querySelectorAll('[data-section="' + id + '"]');
        for (var i = 0; i < targetNavs.length; i++) {
            targetNavs[i].classList.add('active');
        }
        // Close mobile menu
        document.getElementById('sidebar').classList.remove('open');
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('collapsed');
        try { localStorage.setItem('sidebarCollapsed', document.getElementById('sidebar').classList.contains('collapsed')); } catch(e) {}
    }

    function toggleMobileMenu() {
        document.getElementById('sidebar').classList.toggle('open');
    }

    function renderDashboard() {
        var today = new Date().toISOString().slice(0, 10);
        var todayLogs = [];
        for (var i = 0; i < data.logs.length; i++) {
            if (data.logs[i].date === today) {
                todayLogs.push(data.logs[i]);
                if (todayLogs.length >= 3) break;
            }
        }
        var html = '';
        for (var i = 0; i < todayLogs.length; i++) {
            html += '<div class="list-item"><span class="time">' + todayLogs[i].t + '</span><span>' + todayLogs[i].title + '</span></div>';
        }
        if (!html) html = '<div class="list-item">暂无记录</div>';
        document.getElementById('today-list').innerHTML = html;

        html = '';
        for (var i = 0; i < data.skills.length; i++) {
            html += '<span class="tag">' + data.skills[i] + '</span>';
        }
        document.getElementById('skills-tags').innerHTML = html;

        html = '';
        for (var i = 0; i < Math.min(data.logs.length, 4); i++) {
            html += '<div class="list-item"><span class="time">' + data.logs[i].t + '</span><span>' + data.logs[i].title + '</span></div>';
        }
        document.getElementById('logs-list').innerHTML = html;

        html = '';
        for (var i = 0; i < data.outputs.length; i++) {
            var cls = data.outputs[i].status === 'done' ? 'done' : (data.outputs[i].status === 'active' ? 'active' : '');
            var txt = data.outputs[i].status === 'done' ? '已完成' : (data.outputs[i].status === 'active' ? '进行中' : '待处理');
            html += '<div class="card"><div class="card-title">' + data.outputs[i].title + '</div><span class="status ' + cls + '">' + txt + '</span></div>';
        }
        document.getElementById('outputs-cards').innerHTML = html;
    }

    function renderTodos() {
        document.getElementById('todo-count').textContent = data.todos.length;
        var html = '';
        for (var i = 0; i < data.todos.length; i++) {
            html += '<div class="todo-row"><span>' + data.todos[i].text + '</span><button class="todo-btn" onclick="doneTodo(' + data.todos[i].id + ')">✓</button></div>';
        }
        if (!html) html = '<div class="list-item">暂无待办 🎉</div>';
        document.getElementById('todos-list').innerHTML = html;
    }

    function addTodo() {
        var input = document.getElementById('todo-input');
        if (!input.value.trim()) return;
        data.todos.unshift({ id: Date.now(), text: input.value.trim() });
        input.value = '';
        renderTodos();
        try { localStorage.setItem('xiaodong_todos', JSON.stringify(data.todos)); } catch(e) {}
    }

    function doneTodo(id) {
        var newTodos = [];
        for (var i = 0; i < data.todos.length; i++) {
            if (data.todos[i].id !== id) newTodos.push(data.todos[i]);
        }
        data.todos = newTodos;
        renderTodos();
        try { localStorage.setItem('xiaodong_todos', JSON.stringify(data.todos)); } catch(e) {}
    }

    function renderProblems() {
        var html = '';
        for (var i = 0; i < data.problems.length; i++) {
            html += '<div class="problem-box"><div class="problem-title">' + data.problems[i].title + '</div><div class="problem-desc">' + data.problems[i].desc + '</div><div class="solution">💡 ' + data.problems[i].solve + '</div></div>';
        }
        document.getElementById('problems-list').innerHTML = html;
    }

    function renderTweets() {
        var term = document.getElementById('search-input').value.toLowerCase();
        var html = '';
        for (var i = 0; i < data.tweets.length; i++) {
            var t = data.tweets[i];
            if (!term || (t.c && t.c.toLowerCase().indexOf(term) >= 0) || (t.a && t.a.toLowerCase().indexOf(term) >= 0)) {
                html += '<div class="list-item"><span>@' + (t.a || '') + '</span><span>' + (t.c || '（点击查看原文）') + '</span><a href="' + t.u + '" target="_blank" style="color:#6366f1;margin-left:auto">🔗</a></div>';
            }
        }
        if (!html) html = '<div class="list-item">暂无收藏</div>';
        document.getElementById('tweets-list').innerHTML = html;
    }

    // Init
    try {
        if (localStorage.getItem('sidebarCollapsed') === 'true') {
            document.getElementById('sidebar').classList.add('collapsed');
        }
    } catch (e) {}
    renderDashboard();
    renderTodos();
    renderProblems();
    </script>
</body>
</html>
